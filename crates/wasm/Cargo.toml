[package]
name = "prep-wasm"
description = "wasm-bindgen bindings over prep-core. No logic of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
prep-core.workspace = true
# Pinned with `=`: the wasm-bindgen CLI must be exactly this version (spec §5,
# D22). scripts/build-web.sh checks it.
wasm-bindgen = "=0.2.129"
