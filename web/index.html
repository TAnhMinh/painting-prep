<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: the page pads itself with env(safe-area-inset-*) (docs/ui.md). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Painting Prep</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top-bar">
    <h1 id="title" class="no-callout">Painting Prep</h1>
  </header>

  <div id="error" class="banner" role="alert" hidden>
    <span id="error-text"></span>
    <button id="error-close" type="button" aria-label="Dismiss">×</button>
  </div>

  <main id="preview-area" class="preview">
    <label id="choose-big" for="file" class="button big">Choose photo</label>
    <canvas id="preview" hidden></canvas>
  </main>

  <section class="controls" aria-label="Controls">
    <div class="row">
      <label for="file" class="button">Choose photo</label>
      <input id="file" type="file" accept="image/*" class="visually-hidden">
      <span id="status" class="status"></span>
    </div>
    <div class="row">
      <label for="n" class="name">n</label>
      <input id="n" type="range" min="2" max="10" step="1" value="5">
      <output id="n-value" for="n">5</output>
    </div>
    <div class="row" role="radiogroup" aria-label="Output greys">
      <span class="name">greys</span>
      <div class="segmented">
        <input id="greys-even" type="radio" name="greys" value="even" checked>
        <label for="greys-even">Even</label>
        <input id="greys-mean" type="radio" name="greys" value="mean">
        <label for="greys-mean">Mean</label>
      </div>
    </div>
  </section>
</body>
</html>
