[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
prep-core = { path = "crates/core" }

# Spec §5: release optimized for speed.
[profile.release]
opt-level = 3
lto = true
