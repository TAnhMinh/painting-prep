<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: the page pads itself with env(safe-area-inset-*) (docs/ui.md). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f1b26">
  <title>Painting Prep</title>
  <link rel="stylesheet" href="style.css">
  <!-- PWA: installable, offline, home-screen icon (spec M4). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Paint Prep">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top-bar">
    <h1 id="title" class="no-callout">Painting Prep</h1>
    <button id="settings-open" type="button" class="button">Settings</button>
  </header>

  <div id="error" class="banner" role="alert" hidden>
    <span id="error-text"></span>
    <button id="error-close" type="button" aria-label="Dismiss">×</button>
  </div>

  <!-- Shown when a new deployed version is waiting; reload to apply it (spec §7). -->
  <div id="update-banner" class="banner update" role="status" hidden>
    <span>New version available.</span>
    <button id="update-reload" type="button">Reload</button>
  </div>

  <main id="preview-area" class="preview">
    <label id="choose-big" for="file" class="button big">Choose photo</label>
    <!-- The file input lives here, outside the overlay, so it's reachable even
         when the Settings sheet is closed (both "Choose photo" labels target it). -->
    <input id="file" type="file" accept="image/*" class="visually-hidden">
    <canvas id="preview" hidden></canvas>
  </main>

  <!-- Full-screen Settings sheet (D25): the photo stays full-screen; this opens
       over it, and closes to reveal the photo with the choices applied. -->
  <section id="settings" class="overlay" aria-label="Settings" hidden>
    <div class="overlay-head">
      <strong>Settings</strong>
      <button id="settings-close" type="button" class="button">Done</button>
    </div>
    <div class="controls">
      <div class="row">
        <label for="file" class="button">Choose photo</label>
        <span id="status" class="status"></span>
      </div>
      <div class="row">
        <span class="name">n</span>
        <div class="stepper">
          <button id="n-dec" type="button" aria-label="decrease n">−</button>
          <output id="n-value" for="n-dec n-inc">5</output>
          <button id="n-inc" type="button" aria-label="increase n">+</button>
        </div>
      </div>
      <div class="row" role="radiogroup" aria-label="Output greys">
        <span class="name">greys</span>
        <div class="segmented">
          <input id="greys-even" type="radio" name="greys" value="even" checked>
          <label for="greys-even">Even</label>
          <input id="greys-mean" type="radio" name="greys" value="mean">
          <label for="greys-mean">Mean</label>
        </div>
      </div>
      <div class="row" role="radiogroup" aria-label="Grid">
        <span class="name">grid</span>
        <div class="segmented">
          <input id="grid-off" type="radio" name="grid-mode" value="off" checked>
          <label for="grid-off">Off</label>
          <input id="grid-square" type="radio" name="grid-mode" value="square">
          <label for="grid-square">Square</label>
          <input id="grid-rc" type="radio" name="grid-mode" value="rowscols">
          <label for="grid-rc">R×C</label>
        </div>
      </div>
      <div id="grid-square-row" class="row" role="radiogroup" aria-label="Square cells" hidden>
        <span class="name">axis</span>
        <div class="segmented">
          <input id="axis-width" type="radio" name="grid-axis" value="width" checked>
          <label for="axis-width">Width</label>
          <input id="axis-height" type="radio" name="grid-axis" value="height">
          <label for="axis-height">Height</label>
        </div>
        <span class="name">k</span>
        <div class="stepper">
          <button id="k-dec" type="button" aria-label="decrease cells">−</button>
          <output id="k-value" for="k-dec k-inc">6</output>
          <button id="k-inc" type="button" aria-label="increase cells">+</button>
        </div>
      </div>
      <div id="grid-rc-row" class="row" hidden>
        <span class="name">rows</span>
        <div class="stepper">
          <button id="rows-dec" type="button" aria-label="decrease rows">−</button>
          <output id="rows-value" for="rows-dec rows-inc">3</output>
          <button id="rows-inc" type="button" aria-label="increase rows">+</button>
        </div>
        <span class="name">cols</span>
        <div class="stepper">
          <button id="cols-dec" type="button" aria-label="decrease cols">−</button>
          <output id="cols-value" for="cols-dec cols-inc">3</output>
          <button id="cols-inc" type="button" aria-label="increase cols">+</button>
        </div>
      </div>
      <div id="grid-opts-row" class="row" hidden>
        <span class="name">diag</span>
        <div class="segmented" role="radiogroup" aria-label="Diagonals">
          <input id="diag-off" type="radio" name="grid-diag" value="off" checked>
          <label for="diag-off">Off</label>
          <input id="diag-on" type="radio" name="grid-diag" value="on">
          <label for="diag-on">On</label>
        </div>
        <span class="name">over</span>
        <div class="segmented" role="radiogroup" aria-label="Draw over">
          <input id="over-study" type="radio" name="grid-over" value="study" checked>
          <label for="over-study">Study</label>
          <input id="over-orig" type="radio" name="grid-over" value="original">
          <label for="over-orig">Orig</label>
        </div>
      </div>
      <div id="grid-line-row" class="row" role="radiogroup" aria-label="Line style" hidden>
        <span class="name">line</span>
        <div class="segmented">
          <input id="line-black" type="radio" name="grid-line" value="black">
          <label for="line-black">Black</label>
          <input id="line-white" type="radio" name="grid-line" value="white">
          <label for="line-white">White</label>
          <input id="line-grey" type="radio" name="grid-line" value="grey">
          <label for="line-grey">Grey</label>
          <input id="line-two" type="radio" name="grid-line" value="two" checked>
          <label for="line-two">Two</label>
        </div>
      </div>
      <div id="grid-note-row" class="row" hidden>
        <span class="name">cell</span>
        <span id="grid-note" class="status">partial last cell drawn at the far edge</span>
      </div>
      <!-- Export is two steps (spec F4): Export renders + encodes, then Share
           (or Save fallback) appears and runs in its own tap. -->
      <div class="row">
        <span class="name">export</span>
        <button id="export-btn" type="button" class="button" disabled>Export</button>
        <button id="share-btn" type="button" class="button" hidden>Share</button>
        <a id="export-download" class="button" hidden download>Save</a>
      </div>
      <div id="export-note-row" class="row" hidden>
        <span class="name"></span>
        <span id="export-note" class="status"></span>
      </div>
    </div>
  </section>
</body>
</html>
